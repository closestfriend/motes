name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (AU + VST3)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOTES_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build Motes (AU + VST3)
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS Artifacts
        run: |
          mkdir -p release-macos
          cp -R build/Motes_artefacts/Release/AU/Motes.component release-macos/
          cp -R build/Motes_artefacts/Release/VST3/Motes.vst3 release-macos/
          cd release-macos
          zip -r ../Motes-macOS.zip Motes.component Motes.vst3

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motes-macOS
          path: Motes-macOS.zip
          retention-days: 14

  build-windows:
    name: Build Windows (VST3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMOTES_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build Motes (VST3)
        run: cmake --build build --config Release --target Motes_VST3 test_core test_format

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          Copy-Item -Recurse -Path build/Motes_artefacts/Release/VST3/Motes.vst3 -Destination release-windows/
          Compress-Archive -Path release-windows/Motes.vst3 -DestinationPath Motes-Windows.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motes-Windows
          path: Motes-Windows.zip
          retention-days: 14

  release:
    name: Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Motes-macOS

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Motes-Windows

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Motes-macOS.zip
            Motes-Windows.zip
          generate_release_notes: true

      - name: Publish or Update Latest Pre-Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Motes (Latest Build)"
          body: |
            Automatic build from commit `${{ github.sha }}`.

            - **macOS**: `Motes-macOS.zip` (AU + VST3)
            - **Windows**: `Motes-Windows.zip` (VST3)

            See [README.md](https://github.com/closestfriend/motes#download--installation) for installation and macOS Gatekeeper instructions.
          prerelease: true
          files: |
            Motes-macOS.zip
            Motes-Windows.zip
