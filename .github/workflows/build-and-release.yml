name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (AU + VST3)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOTES_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build Motes (AU + VST3)
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS Artifacts
        run: |
          mkdir -p release-macos
          cp -R build/Motes_artefacts/Release/AU/Motes.component release-macos/
          cp -R build/Motes_artefacts/Release/VST3/Motes.vst3 release-macos/
          cd release-macos
          zip -r ../Motes-macOS.zip Motes.component Motes.vst3

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motes-macOS
          path: Motes-macOS.zip
          retention-days: 14

  release:
    name: Publish Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Motes-macOS

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Motes-macOS.zip
          generate_release_notes: true
